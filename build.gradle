buildscript {
    repositories {
        mavenLocal()
		flatDir {
			dirs "$rootProject.projectDir/jars"
		}
        mavenCentral()
        gradlePluginPortal()
        google()
    }
}

// The Android plugin is declared in android/build.gradle, which is only included
// when an Android SDK is available. Declaring it here would resolve AGP on macOS
// too and break Gradle sync/tasks for the desktop-only build.
allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "warsmash"
        gdxVersion = '1.14.2'
        antlrVersion = '4.13.2'
        xstreamVersion = '1.4.21'
        guavaVersion = '33.8.0-jre'
        commonsCompressVersion = '1.28.0'
        commonsIoVersion = '2.22.0'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url = "https://jitpack.io" }
        // LWJGL 2 rebuild with macOS arm64 natives (the 2015 original only ships x86_64).
        maven { url = "https://maven.legacyfabric.net/" }
    }
}

project(":server") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":shared")
        api "com.thoughtworks.xstream:xstream:$xstreamVersion"
        api "commons-codec:commons-codec:1.23.0"
    }
}

project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        implementation project(":lua")
        runtimeOnly project(path: ":lua", configuration: "desktopNatives")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
        // libGDX and FreeType natives are needed on every desktop OS; the jar also carries libgdxarm64.dylib.
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        // Only the LWJGL replacement is macOS-specific: the stock 2015 build has no arm64 natives.
        // Windows and Linux keep the stock LWJGL 2.9.3 and its own natives from transitive dependencies.
        if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            api "org.lwjgl.lwjgl:lwjgl:2.9.4+legacyfabric.18"
            api "org.lwjgl.lwjgl:lwjgl-platform:2.9.4+legacyfabric.18:natives-osx"
        }
        api "com.google.guava:guava:$guavaVersion"
        api "org.apache.commons:commons-compress:$commonsCompressVersion"
        api "commons-io:commons-io:$commonsIoVersion"
        implementation "org.bytedeco:ffmpeg:8.1.2-1.5.14"
        // The decoder's native libraries only for Windows x64; elsewhere the movies are skipped.
        runtimeOnly "org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64"
        runtimeOnly "org.bytedeco:javacpp:1.5.14:windows-x86_64"
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api project(":shared")
        api project(":fdfparser")
        api project(":jassparser")
        implementation project(":lua")
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.google.guava:guava:$guavaVersion"
        api "org.apache.commons:commons-compress:$commonsCompressVersion"
        api "commons-io:commons-io:$commonsIoVersion"
        api files(fileTree(dir:'../jars', includes: ['*.jar']))
    }
}

project(":lua") {
    apply plugin: "java-library"
}

project(":shared") {
    apply plugin: "java-library"

    dependencies {
    }
}

project(":fdfparser") {
    apply plugin: "antlr"
    apply plugin: "java-library"

    dependencies {
        antlr "org.antlr:antlr4:$antlrVersion" // use antlr version 4
        api "org.antlr:antlr4-runtime:$antlrVersion"
    }

    // The antlr configuration is the code generator with ICU4J; the parsers only need the runtime.
    configurations.api.setExtendsFrom(configurations.api.extendsFrom.findAll { it.name != "antlr" })
}

project(":jassparser") {
    apply plugin: "antlr"
    apply plugin: "java-library"


    dependencies {
        implementation project(":shared")
        antlr "org.antlr:antlr4:$antlrVersion" // use antlr version 4
        api "org.antlr:antlr4-runtime:$antlrVersion"
    }

    configurations.api.setExtendsFrom(configurations.api.extendsFrom.findAll { it.name != "antlr" })
}

tasks.eclipse.doLast {
    delete ".project"
}
